name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  test:
    name: Lint, Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npx vitest run --project server
      - name: Build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          REDIS_URL: redis://localhost:6379
          APP_SECRET: build-placeholder-not-a-secret-000000
        run: npm run build

  e2e:
    name: End-to-End (echtes PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: antonia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/antonia
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-only-secret-ci-only-secret-ci-only
      SETUP_TOKEN: ci-setup-token-12345
      E2E_SETUP_TOKEN: ci-setup-token-12345
      E2E_BASE_URL: http://localhost:3000
      PROTOCOL_HEADER: x-forwarded-proto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start app
        run: |
          nohup node build > app.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break; sleep 1; done
      - run: npx playwright install --with-deps chromium webkit
      - run: >-
          npx playwright test --reporter=line
          --project ipad --project ipad-webkit --project ipad-webkit-portrait
          --project iphone-webkit --project iphone-se-webkit
      - if: failure()
        run: cat app.log

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t antonia:ci .
      - name: Smoke-Test (Container startet, Healthcheck mit echter DB/Redis)
        run: |
          docker network create antonia
          docker run -d --name pg --network antonia -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=antonia postgres:18-alpine
          docker run -d --name redis --network antonia redis:8-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network antonia -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:ci@pg:5432/antonia \
            -e REDIS_URL=redis://redis:6379 \
            -e APP_SECRET=ci-only-secret-ci-only-secret-ci-only \
            antonia:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && exit 0; sleep 2; done
          docker logs app
          exit 1
